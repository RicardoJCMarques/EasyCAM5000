<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">How drill strategy is chosen from hole size against tool size</title>
  <desc id="desc">A hole matching the tool is drilled straight down. A hole larger than the tool is milled in a circular path when Mill Holes is on. A hole smaller than the tool is marked and comes out oversize.</desc>
  <style>
    /* Inlined by figures.js, so these resolve against the page theme.
       Fallbacks match the dark theme in css/theme.css. */
    svg{
      --bg:var(--color-bg-primary,#0f0f0f);
      --panel:var(--color-bg-secondary,#1a1a1a);
      --panel2:var(--color-bg-tertiary,#242424);
      --line:var(--color-border-secondary,#3a3a3a);
      --text:var(--color-text-primary,#e5e5e5);
      --muted:var(--color-text-secondary,#a0a0a0);
      --accent:var(--color-accent-primary,#2563eb);
      --ext:var(--color-geometry-offset-external,#a60000);
      --int:var(--color-geometry-offset-internal,#00a600);
      --on:var(--color-geometry-offset-on,#bcbc02);
      --preview:var(--color-geometry-preview,#0060dd);
      --toolpath:var(--color-geometry-toolpath,#00ffff);
      --copper:var(--color-geometry-source-isolation,#ff8844);
      --drillc:var(--color-operation-drill,#4488ff);
      --clearc:var(--color-operation-clearing,#44ff88);
      --cutc:var(--color-operation-cutout,#ff00ff);
      --stenc:var(--color-operation-stencil,#90177d);
      --ok:var(--color-primitive-peck-mark-good,#16d329);
      --warn:var(--color-primitive-peck-mark-warn,#d2cb00);
      --bad:var(--color-primitive-peck-mark-error,#ff0000);
      --stock:var(--color-render3d-stock,#8a7a5c);
    }
    .bg{fill:var(--bg)}
    .panel{fill:var(--panel)}
    .panel2{fill:var(--panel2)}
    .edge{fill:none;stroke:var(--line);stroke-width:1.5}
    .t{fill:var(--text);font:13px system-ui,sans-serif}
    .tb{fill:var(--text);font:bold 14px system-ui,sans-serif}
    .tm{fill:var(--muted);font:12px system-ui,sans-serif}
  </style>
  <rect class="bg" width="800" height="300"/>
  <text class="tb" x="24" y="34">Every hole is measured against your tool, and colour-coded on the canvas</text>
  <circle cx="140" cy="130" r="34" fill="none" stroke="var(--ok)" stroke-width="3"/>
  <circle cx="140" cy="130" r="34" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text class="t" x="140" y="204" text-anchor="middle" fill="var(--ok)">Hole matches the tool</text>
  <text class="tm" x="140" y="228" text-anchor="middle">drilled straight down,</text>
  <text class="tm" x="140" y="248" text-anchor="middle">pecked if it is deep</text>
  <circle cx="400" cy="130" r="24" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <circle cx="400" cy="130" r="34" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text class="t" x="400" y="204" text-anchor="middle" fill="var(--warn)">Hole is bigger than the tool</text>
  <text class="tm" x="400" y="228" text-anchor="middle">it can be either pecked down at center</text>
  <text class="tm" x="400" y="248" text-anchor="middle">or milled around to exact dimension</text>
  <circle cx="660" cy="130" r="52" fill="none" stroke="var(--bad)" stroke-width="3"/>
  <circle cx="660" cy="130" r="34" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text class="t" x="660" y="204" text-anchor="middle" fill="var(--bad)">Hole is smaller than the tool</text>
  <text class="tm" x="660" y="228" text-anchor="middle">marked so you can find it,</text>
  <text class="tm" x="660" y="248" text-anchor="middle">but it comes out oversize</text>
  <text class="tm" x="24" y="284">Dashed circle = hole geometry object, tool references are colored.</text>
</svg>

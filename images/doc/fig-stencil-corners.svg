<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">Why a stencil aperture needs a corner radius</title>
  <desc id="desc">A round cutter cannot follow a sharp inside corner. Without a radius the blade overshoots and distorts the aperture. With one, the corner is something the blade can actually track.</desc>
  <style>
    /* Inlined by figures.js, so these resolve against the page theme.
       Fallbacks match the dark theme in css/theme.css. */
    svg{
      --bg:var(--color-bg-primary,#0f0f0f);
      --panel:var(--color-bg-secondary,#1a1a1a);
      --panel2:var(--color-bg-tertiary,#242424);
      --line:var(--color-border-secondary,#3a3a3a);
      --text:var(--color-text-primary,#e5e5e5);
      --muted:var(--color-text-secondary,#a0a0a0);
      --accent:var(--color-accent-primary,#2563eb);
      --ext:var(--color-geometry-offset-external,#a60000);
      --int:var(--color-geometry-offset-internal,#00a600);
      --on:var(--color-geometry-offset-on,#bcbc02);
      --preview:var(--color-geometry-preview,#0060dd);
      --toolpath:var(--color-geometry-toolpath,#00ffff);
      --copper:var(--color-geometry-source-isolation,#ff8844);
      --drillc:var(--color-operation-drill,#4488ff);
      --clearc:var(--color-operation-clearing,#44ff88);
      --cutc:var(--color-operation-cutout,#ff00ff);
      --stenc:var(--color-operation-stencil,#90177d);
      --ok:var(--color-primitive-peck-mark-good,#16d329);
      --warn:var(--color-primitive-peck-mark-warn,#d2cb00);
      --bad:var(--color-primitive-peck-mark-error,#ff0000);
      --stock:var(--color-render3d-stock,#8a7a5c);
    }
    .bg{fill:var(--bg)}
    .panel{fill:var(--panel)}
    .panel2{fill:var(--panel2)}
    .edge{fill:none;stroke:var(--line);stroke-width:1.5}
    .t{fill:var(--text);font:13px system-ui,sans-serif}
    .tb{fill:var(--text);font:bold 14px system-ui,sans-serif}
    .tm{fill:var(--muted);font:12px system-ui,sans-serif}
  </style>
  <rect class="bg" width="800" height="340"/>
  <text class="tb" x="24" y="34">A round cutter cannot turn a corner tighter than itself</text>
  <rect class="panel2" x="60" y="80" width="180" height="120" stroke="var(--muted)" stroke-width="2"/>
  <path d="M90 110h120v60H90z" fill="none" stroke="var(--int)" stroke-width="3"/>
  <circle cx="90" cy="110" r="16" fill="none" stroke="var(--bad)" stroke-width="2" stroke-dasharray="4 4"/>
  <text class="t" x="150" y="234" text-anchor="middle" fill="var(--bad)">Square corners</text>
  <text class="tm" x="150" y="258" text-anchor="middle">the blade cannot reach the</text>
  <text class="tm" x="150" y="278" text-anchor="middle">corner, so it overshoots and</text>
  <text class="tm" x="150" y="298" text-anchor="middle">distorts the aperture</text>
  <rect class="panel2" x="310" y="80" width="180" height="120" stroke="var(--muted)" stroke-width="2"/>
  <rect x="340" y="110" width="120" height="60" rx="16" fill="none" stroke="var(--int)" stroke-width="3"/>
  <circle cx="356" cy="126" r="16" fill="none" stroke="var(--ok)" stroke-width="2" stroke-dasharray="4 4"/>
  <text class="t" x="400" y="234" text-anchor="middle" fill="var(--ok)">Corner radius set</text>
  <text class="tm" x="400" y="258" text-anchor="middle">the corner is now a curve the</text>
  <text class="tm" x="400" y="278" text-anchor="middle">blade can follow, and the</text>
  <text class="tm" x="400" y="298" text-anchor="middle">aperture keeps its size</text>
  <rect class="panel2" x="560" y="80" width="180" height="120" stroke="var(--muted)" stroke-width="2"/>
  <path d="M590 110h120v60H590z" fill="none" stroke="var(--int)" stroke-width="3"/>
  <circle cx="590" cy="110" r="30" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4 4"/>
  <text class="t" x="650" y="234" text-anchor="middle" fill="var(--warn)">Radius too small</text>
  <text class="tm" x="650" y="258" text-anchor="middle">a radius smaller than the</text>
  <text class="tm" x="650" y="278" text-anchor="middle">cutter cannot be cut - the</text>
  <text class="tm" x="650" y="298" text-anchor="middle">corner stays square, with a warning</text>
  <text class="tm" x="24" y="326">Dashed circle = the cutter. The same rule applies wherever a path turns tighter than the tool, inside or outside.</text>
</svg>

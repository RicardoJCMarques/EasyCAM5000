<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">A board cutout with four holding tabs</title>
  <desc id="desc">In plan, the cut path is interrupted at four tab positions. In section, the cut floor rises over each tab, leaving that much material holding the board.</desc>
  <style>
    /* Inlined by figures.js, so these resolve against the page theme.
       Fallbacks match the dark theme in css/theme.css. */
    svg{
      --bg:var(--color-bg-primary,#0f0f0f);
      --panel:var(--color-bg-secondary,#1a1a1a);
      --panel2:var(--color-bg-tertiary,#242424);
      --line:var(--color-border-secondary,#3a3a3a);
      --text:var(--color-text-primary,#e5e5e5);
      --muted:var(--color-text-secondary,#a0a0a0);
      --accent:var(--color-accent-primary,#2563eb);
      --ext:var(--color-geometry-offset-external,#a60000);
      --int:var(--color-geometry-offset-internal,#00a600);
      --on:var(--color-geometry-offset-on,#bcbc02);
      --preview:var(--color-geometry-preview,#0060dd);
      --toolpath:var(--color-geometry-toolpath,#00ffff);
      --copper:var(--color-geometry-source-isolation,#ff8844);
      --drillc:var(--color-operation-drill,#4488ff);
      --clearc:var(--color-operation-clearing,#44ff88);
      --cutc:var(--color-operation-cutout,#ff00ff);
      --stenc:var(--color-operation-stencil,#90177d);
      --ok:var(--color-primitive-peck-mark-good,#16d329);
      --warn:var(--color-primitive-peck-mark-warn,#d2cb00);
      --bad:var(--color-primitive-peck-mark-error,#ff0000);
      --stock:var(--color-render3d-stock,#8a7a5c);
    }
    .bg{fill:var(--bg)}
    .panel{fill:var(--panel)}
    .panel2{fill:var(--panel2)}
    .edge{fill:none;stroke:var(--line);stroke-width:1.5}
    .t{fill:var(--text);font:13px system-ui,sans-serif}
    .tb{fill:var(--text);font:bold 14px system-ui,sans-serif}
    .tm{fill:var(--muted);font:12px system-ui,sans-serif}
  </style>
  <rect class="bg" width="800" height="300"/>
  <text class="tb" x="24" y="32">Plan - four tabs interrupt the cut</text>
  <rect class="panel2" x="60" y="60" width="300" height="150" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M60 60h110M250 60h110M360 60v45M360 165v45M360 210H250M170 210H60M60 210v-45M60 105V60"
        fill="none" stroke="var(--ext)" stroke-width="3"/>
  <text class="tm" x="210" y="244" text-anchor="middle">the gaps in the path are the tabs</text>
  <text class="tm" x="210" y="266" text-anchor="middle">tab width is the length of each gap</text>

  <text class="tb" x="440" y="32">Section - the cut floor rises over the tab</text>
  <rect x="450" y="70" width="310" height="90" fill="var(--stock)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M450 160h310" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M460 160h110v-28h60v28h110" fill="none" stroke="var(--ext)" stroke-width="3"/>
  <path d="M600 132v28" stroke="var(--line)" stroke-width="1"/>
  <text class="tm" x="612" y="152">tab height</text>
  <path d="M436 70v90" stroke="var(--line)" stroke-width="1"/>
  <text class="tm" x="450" y="186">stock thickness</text>
  <text class="tm" x="440" y="244">Tab height is measured up from the cut floor, so a 0.5 mm tab on a</text>
  <text class="tm" x="440" y="266">1.8 mm cut leaves 0.5 mm of material holding the board in place.</text>
</svg>

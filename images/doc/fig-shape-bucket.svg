<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">An operation and its stages in the operations list</title>
  <desc id="desc">The operation entry itself holds the source geometry parameters. Underneath it sit the offsets, the tool reach preview and the toolpaths, each of which can be shown, hidden or deleted on its own.</desc>
  <style>
    /* Inlined by figures.js, so these resolve against the page theme.
       Fallbacks match the dark theme in css/theme.css. */
    svg{
      --bg:var(--color-bg-primary,#0f0f0f);
      --panel:var(--color-bg-secondary,#1a1a1a);
      --panel2:var(--color-bg-tertiary,#242424);
      --line:var(--color-border-secondary,#3a3a3a);
      --text:var(--color-text-primary,#e5e5e5);
      --muted:var(--color-text-secondary,#a0a0a0);
      --accent:var(--color-accent-primary,#2563eb);
      --ext:var(--color-geometry-offset-external,#a60000);
      --int:var(--color-geometry-offset-internal,#00a600);
      --on:var(--color-geometry-offset-on,#bcbc02);
      --preview:var(--color-geometry-preview,#0060dd);
      --toolpath:var(--color-geometry-toolpath,#00ffff);
      --copper:var(--color-geometry-source-isolation,#ff8844);
      --drillc:var(--color-operation-drill,#4488ff);
      --clearc:var(--color-operation-clearing,#44ff88);
      --cutc:var(--color-operation-cutout,#ff00ff);
      --stenc:var(--color-operation-stencil,#90177d);
      --ok:var(--color-primitive-peck-mark-good,#16d329);
      --warn:var(--color-primitive-peck-mark-warn,#d2cb00);
      --bad:var(--color-primitive-peck-mark-error,#ff0000);
      --stock:var(--color-render3d-stock,#8a7a5c);
    }
    .bg{fill:var(--bg)}
    .panel{fill:var(--panel)}
    .panel2{fill:var(--panel2)}
    .edge{fill:none;stroke:var(--line);stroke-width:1.5}
    .t{fill:var(--text);font:13px system-ui,sans-serif}
    .tb{fill:var(--text);font:bold 14px system-ui,sans-serif}
    .tm{fill:var(--muted);font:12px system-ui,sans-serif}
  </style>
  <rect class="bg" width="800" height="340"/>
  <rect class="panel" x="30" y="24" width="360" height="38" rx="5" stroke="var(--accent)" stroke-width="2"/>
  <rect x="30" y="24" width="4" height="38" fill="var(--copper)"/>
  <text class="t" x="50" y="48">Profile Cut - 4 shapes</text>
  <rect class="panel2" x="66" y="74" width="324" height="32" rx="5" stroke="var(--line)"/>
  <text class="tm" x="86" y="96">Offsets</text>
  <rect class="panel2" x="66" y="116" width="324" height="32" rx="5" stroke="var(--line)"/>
  <text class="tm" x="86" y="138">Tool Reach</text>
  <rect class="panel2" x="66" y="158" width="324" height="32" rx="5" stroke="var(--line)"/>
  <text class="tm" x="86" y="180">Toolpaths</text>
  <path d="M48 62v112M48 90h18M48 132h18M48 174h18" stroke="var(--line)" stroke-width="1.5" fill="none"/>
  <text class="tm" x="430" y="48">Select the operation itself for the geometry</text>
  <text class="tm" x="430" y="70">parameters - tool, cut side, tabs.</text>
  <text class="tm" x="430" y="107">Select Offsets for the depth parameters,</text>
  <text class="tm" x="430" y="129">then generate the preview.</text>
  <text class="tm" x="430" y="166">Select Tool Reach for feeds and speeds,</text>
  <text class="tm" x="430" y="188">then generate the toolpaths.</text>
  <text class="tm" x="30" y="248">Each stage produces one layer. Re-running a stage replaces its own layer and clears the ones after it,</text>
  <text class="tm" x="30" y="270">so changing the depth never costs you the offsets you already generated.</text>
  <text class="tm" x="30" y="306">3D operations - V-Carve, Relief, Rotary - have no depth stage, so they go straight from the</text>
  <text class="tm" x="30" y="328">operation to Toolpaths.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">EasyShape5000 interface layout</title>
  <desc id="desc">Toolbar across the top. On the left, the operations list above the scene tree. Canvas in the centre. On the right, stock setup, then machine settings, then the parameters for the current stage. Status bar along the bottom.</desc>
  <style>
    /* Inlined by figures.js, so these resolve against the page theme.
       Fallbacks match the dark theme in css/theme.css. */
    svg{
      --bg:var(--color-bg-primary,#0f0f0f);
      --panel:var(--color-bg-secondary,#1a1a1a);
      --panel2:var(--color-bg-tertiary,#242424);
      --line:var(--color-border-secondary,#3a3a3a);
      --text:var(--color-text-primary,#e5e5e5);
      --muted:var(--color-text-secondary,#a0a0a0);
      --accent:var(--color-accent-primary,#2563eb);
      --ext:var(--color-geometry-offset-external,#a60000);
      --int:var(--color-geometry-offset-internal,#00a600);
      --on:var(--color-geometry-offset-on,#bcbc02);
      --preview:var(--color-geometry-preview,#0060dd);
      --toolpath:var(--color-geometry-toolpath,#00ffff);
      --copper:var(--color-geometry-source-isolation,#ff8844);
      --drillc:var(--color-operation-drill,#4488ff);
      --clearc:var(--color-operation-clearing,#44ff88);
      --cutc:var(--color-operation-cutout,#ff00ff);
      --stenc:var(--color-operation-stencil,#90177d);
      --ok:var(--color-primitive-peck-mark-good,#16d329);
      --warn:var(--color-primitive-peck-mark-warn,#d2cb00);
      --bad:var(--color-primitive-peck-mark-error,#ff0000);
      --stock:var(--color-render3d-stock,#8a7a5c);
    }
    .bg{fill:var(--bg)}
    .panel{fill:var(--panel)}
    .panel2{fill:var(--panel2)}
    .edge{fill:none;stroke:var(--line);stroke-width:1.5}
    .t{fill:var(--text);font:13px system-ui,sans-serif}
    .tb{fill:var(--text);font:bold 14px system-ui,sans-serif}
    .tm{fill:var(--muted);font:12px system-ui,sans-serif}
  </style>
  <rect class="bg" width="800" height="480"/>
  <rect class="panel2" width="800" height="44"/>
  <text class="t" x="400" y="28" text-anchor="middle">1. TOOLBAR - Actions, undo/redo, 2D/3D view, zoom, theme</text>
  <rect class="panel" y="44" width="200" height="200"/>
  <text class="t" x="100" y="130" text-anchor="middle">2. OPERATIONS</text>
  <text class="tm" x="100" y="154" text-anchor="middle">one entry per operation,</text>
  <text class="tm" x="100" y="176" text-anchor="middle">with its stages underneath</text>
  <rect class="panel2" y="244" width="200" height="192"/>
  <text class="t" x="100" y="326" text-anchor="middle">3. SCENE TREE</text>
  <text class="tm" x="100" y="350" text-anchor="middle">groups and shapes,</text>
  <text class="tm" x="100" y="372" text-anchor="middle">lock and visibility</text>
  <rect class="bg" x="200" y="44" width="400" height="392"/>
  <rect x="200" y="44" width="400" height="392" fill="none" stroke="var(--line)" stroke-width="1.5"/>
  <text class="t" x="400" y="230" text-anchor="middle">4. CANVAS</text>
  <text class="tm" x="400" y="254" text-anchor="middle">2D, or 3D once toolpaths exist</text>
  <rect class="panel" x="600" y="44" width="200" height="128"/>
  <text class="t" x="700" y="98" text-anchor="middle">5. STOCK SETUP</text>
  <text class="tm" x="700" y="122" text-anchor="middle">blank size, thickness,</text>
  <text class="tm" x="700" y="144" text-anchor="middle">Z-zero reference</text>
  <rect class="panel2" x="600" y="172" width="200" height="104"/>
  <text class="t" x="700" y="214" text-anchor="middle">6. MACHINE SETTINGS</text>
  <text class="tm" x="700" y="238" text-anchor="middle">post-processor, heights,</text>
  <text class="tm" x="700" y="260" text-anchor="middle">line numbers</text>
  <rect class="panel" x="600" y="276" width="200" height="160"/>
  <text class="t" x="700" y="332" text-anchor="middle">7. CUT SETTINGS</text>
  <text class="tm" x="700" y="356" text-anchor="middle">shape transforms, and the</text>
  <text class="tm" x="700" y="378" text-anchor="middle">parameters for this stage</text>
  <rect class="panel2" y="436" width="800" height="44"/>
  <text class="t" x="400" y="464" text-anchor="middle">8. STATUS BAR, LOG &amp; DISPLAY OPTIONS</text>
</svg>

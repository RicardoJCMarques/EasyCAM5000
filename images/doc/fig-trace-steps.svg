<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">The stages each machine needs</title>
  <desc id="desc">A router operation runs four stages and produces offsets, a preview and toolpaths. A laser or knife operation runs two and produces offsets only. The machine is chosen per operation, so one job can mix them.</desc>
  <style>
    /* Inlined by figures.js, so these resolve against the page theme.
       Fallbacks match the dark theme in css/theme.css. */
    svg{
      --bg:var(--color-bg-primary,#0f0f0f);
      --panel:var(--color-bg-secondary,#1a1a1a);
      --panel2:var(--color-bg-tertiary,#242424);
      --line:var(--color-border-secondary,#3a3a3a);
      --text:var(--color-text-primary,#e5e5e5);
      --muted:var(--color-text-secondary,#a0a0a0);
      --accent:var(--color-accent-primary,#2563eb);
      --ext:var(--color-geometry-offset-external,#a60000);
      --int:var(--color-geometry-offset-internal,#00a600);
      --on:var(--color-geometry-offset-on,#bcbc02);
      --preview:var(--color-geometry-preview,#0060dd);
      --toolpath:var(--color-geometry-toolpath,#00ffff);
      --copper:var(--color-geometry-source-isolation,#ff8844);
      --drillc:var(--color-operation-drill,#4488ff);
      --clearc:var(--color-operation-clearing,#44ff88);
      --cutc:var(--color-operation-cutout,#ff00ff);
      --stenc:var(--color-operation-stencil,#90177d);
      --ok:var(--color-primitive-peck-mark-good,#16d329);
      --warn:var(--color-primitive-peck-mark-warn,#d2cb00);
      --bad:var(--color-primitive-peck-mark-error,#ff0000);
      --stock:var(--color-render3d-stock,#8a7a5c);
    }
    .bg{fill:var(--bg)}
    .panel{fill:var(--panel)}
    .panel2{fill:var(--panel2)}
    .edge{fill:none;stroke:var(--line);stroke-width:1.5}
    .t{fill:var(--text);font:13px system-ui,sans-serif}
    .tb{fill:var(--text);font:bold 14px system-ui,sans-serif}
    .tm{fill:var(--muted);font:12px system-ui,sans-serif}
  </style>
  <rect class="bg" width="800" height="340"/>
  <text class="tb" x="24" y="30">Router - Copper Isolation, Clearing, Cutout, Drill, Stencil</text>
  <rect class="panel" x="24" y="44" width="172" height="50" rx="6" stroke="var(--line)" stroke-width="1.5"/>
  <text class="t" x="110" y="66" text-anchor="middle">Source Geometry</text><text class="tm" x="110" y="86" text-anchor="middle">&#8594; Offsets</text>
  <rect class="panel" x="212" y="44" width="172" height="50" rx="6" stroke="var(--line)" stroke-width="1.5"/>
  <text class="t" x="298" y="66" text-anchor="middle">Z Strategy</text><text class="tm" x="298" y="86" text-anchor="middle">&#8594; Preview</text>
  <rect class="panel" x="400" y="44" width="172" height="50" rx="6" stroke="var(--line)" stroke-width="1.5"/>
  <text class="t" x="486" y="66" text-anchor="middle">Feeds &amp; Toolpaths</text><text class="tm" x="486" y="86" text-anchor="middle">&#8594; Toolpaths</text>
  <rect class="panel2" x="588" y="44" width="172" height="50" rx="6" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="674" y="66" text-anchor="middle">Output</text><text class="tm" x="674" y="86" text-anchor="middle">Export Manager</text>
  <path d="M196 69h16M384 69h16M572 69h16" stroke="var(--muted)" stroke-width="2"/>
  <text class="tb" x="24" y="150">Laser - Copper Isolation, Clearing, Cutout, Drill, Stencil</text>
  <rect class="panel" x="24" y="164" width="172" height="50" rx="6" stroke="var(--line)" stroke-width="1.5"/>
  <text class="t" x="110" y="186" text-anchor="middle">Source Geometry</text><text class="tm" x="110" y="206" text-anchor="middle">&#8594; Offsets</text>
  <rect class="panel2" x="212" y="164" width="172" height="50" rx="6" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="298" y="186" text-anchor="middle">Output</text><text class="tm" x="298" y="206" text-anchor="middle">SVG / PNG</text>
  <path d="M196 189h16" stroke="var(--muted)" stroke-width="2"/>
  <text class="tm" x="410" y="186">No depth and no toolpaths -</text>
  <text class="tm" x="410" y="208">the geometry is the deliverable.</text>
  <text class="tb" x="24" y="270">Drag knife - Stencil</text>
  <rect class="panel" x="24" y="284" width="172" height="50" rx="6" stroke="var(--line)" stroke-width="1.5"/>
  <text class="t" x="110" y="306" text-anchor="middle">Source Geometry</text><text class="tm" x="110" y="326" text-anchor="middle">&#8594; Offsets</text>
  <rect class="panel2" x="212" y="284" width="172" height="50" rx="6" stroke="var(--accent)" stroke-width="2"/>
  <text class="t" x="298" y="306" text-anchor="middle">Output</text><text class="tm" x="298" y="326" text-anchor="middle">Vector SVG</text>
  <path d="M196 309h16" stroke="var(--muted)" stroke-width="2"/>
  <text class="tm" x="410" y="306">The machine is set per operation, so one job can</text>
  <text class="tm" x="410" y="328">mix router, laser and knife.</text>
</svg>

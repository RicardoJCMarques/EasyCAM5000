name: Bug Report
description: Report a parsing error, renderer glitch, crash, or wrong G-code/SVG (laser/stencil)
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### Before you submit
        Please check the [known limitations](https://github.com/RicardoJCMarques/EasyCAM5000#status-and-known-limitations),
        [known bugs](https://github.com/RicardoJCMarques/EasyCAM5000/blob/main/CHANGELOG.md)
        and for [open issues](https://github.com/RicardoJCMarques/EasyCAM5000/issues).

  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options:
        - EasyTrace5000 (PCB)
        - EasyShape5000 (CNC routing)
        - Both / not sure
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Where does it go wrong?
      options:
        - "Loading / parsing the file"
        - "Generate Offsets (geometry)"
        - "Generate Preview (strategy)"
        - "Calculate Toolpaths"
        - "Export (G-code / SVG / PNG)"
        - "Rendering only - the output is fine"
        - "Something else / not sure"
    validations:
      required: true

  - type: input
    id: operation
    attributes:
      label: Operation type
      description: Isolation, clearing, drill, cutout, stencil, profile, pocket, engrave, v-carve, relief, rotary...
      placeholder: "Drilling (peck), on a KiCad .drl"
    validations:
      required: false

  - type: input
    id: post
    attributes:
      label: Post-processor and machine
      description: Only needed if the G-code itself is wrong.
      placeholder: "grblHAL on a custom router, tool change enabled"
    validations:
      required: false
  
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong, and what you saw. If the app didn't crash but the output was wrong, describe the output.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        1. Load file...
        2. Set tool diameter to...
        3. Click 'Generate Offsets'
      placeholder: |
        1. Loaded attached 'Test_Board.gbr'
        2. Set Tool Diameter to 0.4mm
        3. Clicked Generate Offsets
        4. App froze / Console showed error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      description: For wrong-output reports this is the most useful field on the form.
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Reproduction Files (Recommended)
      description: |
        **Please drag & drop the Gerber/Excellon/SVG file that causes the issue here.**
        *Note: If your file is proprietary, please create a minimal example that demonstrates the problem.*
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Browser & OS
      description: |
        Since this is a web-based CAM tool, the browser engine matters.
      placeholder: "Chrome 120 on Windows 11 (or Safari on macOS, Firefox on Linux)"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console Logs
      description: |
        Press **F12**, open the **Console** tab, and run the line for your app:
        `enableTraceDebug()` — EasyTrace5000
        `enableShapeDebug()` — EasyShape5000
        Then reproduce the problem and paste the output below (red errors especially).
      render: shell
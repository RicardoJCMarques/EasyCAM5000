name: Deploy
on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 1. Build + minify. The target list lives in build.js (--minify) so
      #    a local `node build.js --minify` produces the same artifact.
      - name: Build Production Assets
        run: |
          npm install terser html-minifier-terser esbuild --no-save
          node .github/scripts/build.js --src . --dist ./dist --minify

      # 2. Deploy: Upload dist folder via FTP
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /
          exclude: |
            **/.git*
            **/.DS_Store
            **/.build-manifest.json